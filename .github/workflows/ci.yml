name: CI/CD Pipeline

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  # TypeScript/Node.js tests
  typescript-tests:
    name: TypeScript Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run build

      - name: Run linter
        run: npm run lint:ts

      - name: Run TypeScript tests
        run: npm run test:ts

  # Python tests
  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Java for Freerouting tests
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            -r requirements-dev-lock.txt

      - name: Run pytest
        run: python -m pytest tests/ --cov=python --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v6
        with:
          files: ./coverage.xml
          flags: python
          name: python-${{ matrix.python-version }}
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-24.04'

  # Cross-platform Python smoke tests catch runtime/path assumptions without
  # duplicating the full Linux compatibility matrix.
  python-platform-smoke:
    name: Python Runtime Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install hash-locked Python dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev-lock.txt

      - name: Compile Python runtime
        run: python -m compileall -q python

      - name: Run cross-platform runtime smoke tests
        run: >-
          python -m pytest -q
          tests/test_command_envelope.py
          tests/test_backend_metadata.py
          tests/test_interface_construction.py
          tests/test_platform_helper.py
          tests/test_kicad_cli_resolver.py
          tests/test_kicad_roots.py
          tests/test_cairo_dll_preload_windows.py
          tests/test_logging_config.py

  # Python static analysis (run once; the test job carries compatibility coverage)
  python-quality:
    name: Python Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            -r requirements-dev-lock.txt

      - name: Run Black formatter check
        run: python -m black --check python/ tests/

      - name: Run isort import-order check
        run: python -m isort --check-only python/ tests/

      - name: Run MyPy type checker
        run: python -m mypy python/

      - name: Run Pylint
        run: python -m pylint --errors-only python/

  # Integration tests (requires KiCAD)
  integration-tests:
    name: Integration Tests (Linux + KiCAD)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kicad: ["8.0", "9.0", "10.0"]

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Add KiCAD PPA and Install KiCAD ${{ matrix.kicad }}
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-${{ matrix.kicad }}-releases
          sudo apt-get update
          sudo apt-get install -y kicad kicad-libraries

          mapfile -t KICAD_PYTHON_PACKAGES < <(
            {
              apt-cache search kicad
              apt-cache search pcbnew
            } | awk '
              BEGIN { IGNORECASE = 1 }
              {
                name = $1
                line = tolower($0)
                if (name !~ /nightly/ && (line ~ /kicad/ || line ~ /pcbnew/) && line ~ /python/) print name
              }
            ' | sort -u
          )

          if [ "${#KICAD_PYTHON_PACKAGES[@]}" -gt 0 ]; then
            echo "Installing KiCad Python packages: ${KICAD_PYTHON_PACKAGES[*]}"
            sudo apt-get install -y "${KICAD_PYTHON_PACKAGES[@]}"
          fi

          KICAD_PYTHONPATH="$(python3 - <<'PY'
          import glob
          import os
          import subprocess
          import sys
          from pathlib import Path

          candidates = []
          seen = set()


          def add_candidate(root: Path) -> None:
              if not root.exists():
                  return
              root_str = str(root)
              if root_str not in seen:
                  seen.add(root_str)
                  candidates.append(root_str)


          def add_candidate_for_file(file_path: Path) -> None:
              if file_path.name == "__init__.py" and file_path.parent.name == "pcbnew":
                  add_candidate(file_path.parent.parent)
                  return
              if file_path.parent.name == "pcbnew":
                  add_candidate(file_path.parent.parent)
                  return
              add_candidate(file_path.parent)


          def looks_like_pcbnew(file_path: Path) -> bool:
              name = file_path.name
              if name == "pcbnew.py":
                  return True
              if name == "__init__.py" and file_path.parent.name == "pcbnew":
                  return True
              return name.endswith(".so") and (
                  name.startswith("pcbnew") or name.startswith("_pcbnew")
              )


          def collect_from_package(package: str) -> None:
              try:
                  result = subprocess.run(
                      ["dpkg", "-L", package],
                      check=True,
                      capture_output=True,
                      text=True,
                  )
              except subprocess.CalledProcessError:
                  return

              for raw_path in result.stdout.splitlines():
                  path = Path(raw_path)
                  if path.is_file() and looks_like_pcbnew(path):
                      add_candidate_for_file(path)


          package_result = subprocess.run(
              ["dpkg-query", "-W", "-f=${Package}\n"],
              check=True,
              capture_output=True,
              text=True,
          )
          installed_packages = [
              package
              for package in package_result.stdout.splitlines()
              if "kicad" in package or "pcbnew" in package
          ]

          for package in installed_packages:
              collect_from_package(package)

          file_patterns = [
              "/usr/lib/python3/dist-packages/pcbnew.py",
              "/usr/lib/python3/dist-packages/pcbnew*.so",
              "/usr/lib/python3/dist-packages/_pcbnew*.so",
              "/usr/lib/python3/dist-packages/pcbnew/__init__.py",
              "/usr/lib/python3/dist-packages/pcbnew/_pcbnew*.so",
              "/usr/lib/kicad*/lib/python3/dist-packages/pcbnew.py",
              "/usr/lib/kicad*/lib/python3/dist-packages/pcbnew*.so",
              "/usr/lib/kicad*/lib/python3/dist-packages/_pcbnew*.so",
              "/usr/lib/kicad*/lib/python3/dist-packages/pcbnew/__init__.py",
              "/usr/lib/kicad*/lib/python3/dist-packages/pcbnew/_pcbnew*.so",
              "/usr/lib/*/dist-packages/pcbnew.py",
              "/usr/lib/*/dist-packages/pcbnew*.so",
              "/usr/lib/*/dist-packages/_pcbnew*.so",
              "/usr/lib/*/dist-packages/pcbnew/__init__.py",
              "/usr/lib/*/dist-packages/pcbnew/_pcbnew*.so",
              "/usr/local/lib/python*/dist-packages/pcbnew.py",
              "/usr/local/lib/python*/dist-packages/pcbnew*.so",
              "/usr/local/lib/python*/dist-packages/_pcbnew*.so",
              "/usr/local/lib/python*/dist-packages/pcbnew/__init__.py",
              "/usr/local/lib/python*/dist-packages/pcbnew/_pcbnew*.so",
              "/usr/share/kicad*/scripting/pcbnew.py",
              "/usr/share/kicad*/scripting/pcbnew*.so",
              "/usr/share/kicad*/scripting/_pcbnew*.so",
              "/usr/share/kicad*/scripting/pcbnew/__init__.py",
              "/usr/share/kicad*/scripting/pcbnew/_pcbnew*.so",
          ]

          for pattern in file_patterns:
              for raw_path in glob.glob(pattern):
                  path = Path(raw_path)
                  if path.is_file() and looks_like_pcbnew(path):
                      add_candidate_for_file(path)

          if not candidates:
              for file_path in Path("/usr").rglob("*"):
                  if file_path.is_file() and looks_like_pcbnew(file_path):
                      add_candidate_for_file(file_path)


          def import_succeeds(candidate: str) -> bool:
              env = os.environ.copy()
              existing = env.get("PYTHONPATH", "")
              env["PYTHONPATH"] = (
                  f"{candidate}:{existing}" if existing else candidate
              )
              probe = subprocess.run(
                  [
                      sys.executable,
                      "-c",
                      (
                          "import pcbnew; "
                          "print(getattr(pcbnew, '__file__', '')); "
                          "print(pcbnew.GetBuildVersion())"
                      ),
                  ],
                  capture_output=True,
                  text=True,
                  env=env,
              )
              if probe.returncode == 0:
                  print(
                      f"Using pcbnew from {probe.stdout.splitlines()[0]}",
                      file=sys.stderr,
                  )
                  return True
              return False


          working_candidates = [candidate for candidate in candidates if import_succeeds(candidate)]
          print(":".join(working_candidates))
          PY
          )"

          if [ -z "$KICAD_PYTHONPATH" ]; then
            echo "Unable to locate pcbnew Python bindings after installing KiCad ${{ matrix.kicad }}" >&2
            {
              apt-cache search kicad
              apt-cache search pcbnew
            } | awk 'BEGIN { IGNORECASE = 1 } tolower($0) ~ /python/ { print }' || true
            dpkg-query -W -f='${Package}\n' | grep -Ei 'kicad|pcbnew' || true
            find /usr -path '*dist-packages*' \( -name 'pcbnew.py' -o -name 'pcbnew*.so' -o -name '_pcbnew*.so' \) -print || true
            exit 1
          fi

          echo "KICAD_PYTHONPATH=$KICAD_PYTHONPATH" >> $GITHUB_ENV

      - name: Verify KiCAD installation
        run: |
          export KICAD_CLI="kicad-cli"
          export PYTHONPATH="$KICAD_PYTHONPATH:$PYTHONPATH"
          "$KICAD_CLI" version
          python3 -c "import pcbnew; print(f'pcbnew version: {pcbnew.GetBuildVersion()}')"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes \
            -r requirements-dev-lock.txt

      - name: Run real pcbnew smoke tests
        env:
          KICAD_USE_REAL_PCBNEW: "1"
        run: |
          export PYTHONPATH="$KICAD_PYTHONPATH:$PYTHONPATH"
          pytest tests/test_real_pcbnew_matrix.py -m "integration and real_pcbnew"

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:ts

      - name: Run Prettier check
        run: npx prettier --check "src/**/*.ts" "tests-ts/**/*.ts"

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=moderate

  # Documentation check
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check README exists
        run: test -f README.md

      - name: Check local Markdown links
        run: python3 scripts/check_markdown_links.py

      - name: Validate JSON files
        run: |
          find . -name "*.json" \
            -not -path "./node_modules/*" \
            -not -path "./dist/*" \
            -print0 | xargs -0 -r -n 1 python3 -m json.tool > /dev/null

  # Validate the exact files consumers receive and the checked-in plugin
  # manifests that launch the package.
  release-artifacts:
    name: Release Artifact & Plugin Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build release files
        run: npm run build

      - name: Create npm tarball
        run: npm pack --ignore-scripts --json > npm-pack.json

      - name: Validate npm tarball and plugin manifests
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { existsSync, readFileSync } from "node:fs";

          const fail = (message) => {
            throw new Error(message);
          };
          const readJson = (path) => JSON.parse(readFileSync(path, "utf8"));

          const packResults = readJson("npm-pack.json");
          if (!Array.isArray(packResults) || packResults.length !== 1) {
            fail("npm pack did not describe exactly one tarball");
          }

          const archive = packResults[0].filename;
          if (typeof archive !== "string" || !existsSync(archive)) {
            fail("npm pack did not create the reported tarball");
          }

          const packedFiles = new Set(
            execFileSync("tar", ["-tzf", archive], { encoding: "utf8" })
              .split(/\r?\n/)
              .filter(Boolean)
              .map((path) => path.replace(/^package\//, "").replace(/\/$/, "")),
          );
          const requiredFiles = [
            "package.json",
            "dist/cli.js",
            "dist/server.js",
            "dist/runtime.js",
            "python/kicad_interface.py",
            "python/commands/__init__.py",
            "requirements.txt",
            "requirements-lock.txt",
          ];
          const forbiddenFiles = [
            "python/test_ipc_backend.py",
            "python/requirements.txt",
          ];

          for (const path of requiredFiles) {
            if (!packedFiles.has(path)) fail(`required tarball file is missing: ${path}`);
          }
          for (const path of forbiddenFiles) {
            if (packedFiles.has(path)) fail(`forbidden tarball file is present: ${path}`);
          }

          const packageJson = readJson("package.json");
          const claudeManifest = readJson("plugins/kicad/.claude-plugin/plugin.json");
          const codexManifest = readJson("plugins/kicad/.codex-plugin/plugin.json");
          const mcpManifest = readJson("plugins/kicad/.mcp.json");
          const marketplace = readJson(".claude-plugin/marketplace.json");
          const expectedPackage = `${packageJson.name}@${packageJson.version}`;

          if (claudeManifest.name !== "kicad" || claudeManifest.version !== packageJson.version) {
            fail("Claude plugin name/version does not match the npm package");
          }
          if (claudeManifest.mcpServers !== "./.mcp.json") {
            fail("Claude plugin must reference its checked-in .mcp.json manifest");
          }
          if (codexManifest.name !== "kicad" || codexManifest.version.split("+")[0] !== packageJson.version) {
            fail("Codex plugin name/version does not match the npm package");
          }

          const marketplacePlugin = marketplace.plugins?.find((plugin) => plugin.name === "kicad");
          if (
            marketplacePlugin?.source !== "./plugins/kicad" ||
            marketplacePlugin.version !== packageJson.version
          ) {
            fail("Claude marketplace entry is missing or out of sync");
          }

          const assertMcpLauncher = (server, label) => {
            if (server?.command !== "npx" || !Array.isArray(server.args)) {
              fail(`${label} MCP launcher must use npx with an argument array`);
            }
            if (!server.args.includes("-y") || !server.args.includes(expectedPackage)) {
              fail(`${label} MCP launcher must pin ${expectedPackage}`);
            }
            if (server.args.at(-1) !== "serve") {
              fail(`${label} MCP launcher must invoke the private serve command`);
            }
          };

          assertMcpLauncher(mcpManifest.mcpServers?.kicad, "Claude");
          const codexServer = codexManifest.mcpServers?.kicad;
          assertMcpLauncher(codexServer, "Codex");
          if (!Number.isFinite(codexServer.startup_timeout_sec) || codexServer.startup_timeout_sec <= 0) {
            fail("Codex plugin must define a positive startup timeout");
          }
          if (!Number.isFinite(codexServer.tool_timeout_sec) || codexServer.tool_timeout_sec <= 3600) {
            fail("Codex plugin tool timeout must exceed the one-hour backend operation timeout");
          }
          NODE

      - name: Verify the published plugin launcher
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          test "$(npm view "$package_spec" version)" = "$package_version"
          npx --yes "$package_spec" --help | grep -q "kicad-mcp serve"
