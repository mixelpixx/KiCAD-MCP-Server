repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
        # .gitattributes deliberately pins Windows-native scripts to CRLF
        # (`*.bat`/`*.cmd`/`*.ps1 text eol=crlf`), so forcing them to LF here
        # puts the two in permanent conflict: the hook rewrites to LF, git
        # checks them back out as CRLF, forever. It is invisible on Windows
        # (autocrlf hides the flip-flop) and fails every run on Linux.
        # .gitattributes owns line endings for these types.
        exclude: \.(bat|cmd|ps1)$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3
        args: [--config=pyproject.toml]

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--settings-path=pyproject.toml]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        # Pinned here rather than resolved via `npx` from node_modules: a
        # `language: node` local hook must declare its own dependencies (newer
        # pre-commit asserts this outright), and pinning means the hook formats
        # identically whether or not `npm ci` has run. Keep in step with the
        # prettier version in package.json devDependencies.
        additional_dependencies: ["prettier@3.8.1"]
        types_or: [javascript, ts, json, yaml, markdown]
        exclude: ^(dist/|package-lock\.json|\.venv/|python/)

  - repo: https://github.com/pycqa/flake8
    rev: "7.3.0"
    hooks:
      - id: flake8
        files: ^python/
        args: [--config=.flake8]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.19.1"
    hooks:
      - id: mypy
        files: ^python/
        exclude: ^python/commands/board\.py$
        args: [--config-file=pyproject.toml]
        additional_dependencies:
          - types-requests
          - pytest
          # The hook runs in its own isolated venv, so every third-party import
          # mypy should resolve has to be listed here. python-dotenv ships
          # py.typed, so installing it type-checks the real API rather than
          # silencing the import (commands/jlcpcb.py loads .env credentials).
          - python-dotenv

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        # `language: system` rather than `node`: eslint.config.js imports
        # @eslint/js and typescript-eslint, so eslint has to resolve modules
        # from the repo's own node_modules. An isolated `language: node` env
        # would need those pinned here too and would still resolve the config's
        # imports against the wrong tree. This requires `npm ci` to have run —
        # true for local dev, and the code-quality CI job installs before
        # invoking pre-commit.
        language: system
        types: [ts]
        files: ^src/
